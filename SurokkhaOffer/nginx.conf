server {
    listen 80;
    listen 3002;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
        if_modified_since off;
    }

    # Meta catalog feed: proxied live from the store API, so product changes show up without a deploy
    location = /catalog.csv {
        proxy_pass https://web.surokkha.store/store/v1/products/feed/meta-catalog-offer.csv;
        proxy_ssl_server_name on;
        proxy_set_header Host web.surokkha.store;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
