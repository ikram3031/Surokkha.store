services:
  mongodb:
    image: mongo:7.0
    container_name: ${MONGODB_CONTAINER_NAME:-ecommerce-mongodb-dev}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-11223345}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-ecommerce-db}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data-dev:/data/db
    networks:
      - ecommerce-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-ecommerce-backend-dev}
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-5092}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5092}:${BACKEND_PORT:-5092}"
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  backend-storefront:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${STOREFRONT_BACKEND_CONTAINER_NAME:-ecommerce-backend-storefront-dev}
    restart: always
    env_file:
      - .env
    environment:
      APP_ROLE: storefront
      PORT: ${STOREFRONT_BACKEND_PORT:-4001}
    command: ["node", "src/server.storefront.js"]
    ports:
      - "127.0.0.1:${STOREFRONT_BACKEND_PORT:-4001}:${STOREFRONT_BACKEND_PORT:-4001}"
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  backend-storeweb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${STOREWEB_BACKEND_CONTAINER_NAME:-ecommerce-backend-storeweb-dev}
    restart: always
    env_file:
      - .env
    environment:
      APP_ROLE: storeweb
      PORT: ${STOREWEB_BACKEND_PORT:-4003}
    command: ["node", "src/server.storeWeb.js"]
    ports:
      - "127.0.0.1:${STOREWEB_BACKEND_PORT:-4003}:${STOREWEB_BACKEND_PORT:-4003}"
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  backend-dashboard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${DASHBOARD_BACKEND_CONTAINER_NAME:-ecommerce-backend-dashboard-dev}
    restart: always
    env_file:
      - .env
    environment:
      APP_ROLE: dashboard
      PORT: ${DASHBOARD_BACKEND_PORT:-4002}
    command: ["node", "src/server.dashboard.js"]
    ports:
      - "127.0.0.1:${DASHBOARD_BACKEND_PORT:-4002}:${DASHBOARD_BACKEND_PORT:-4002}"
    volumes:
      - ${UPLOADS_PATH:-./uploads}:/app/uploads
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./SurokkhaShop
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-ecommerce-frontend-dev}
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8001}:8001"
    networks:
      - ecommerce-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_CLIENT=${VITE_CLIENT:-demo}
        - VITE_CLIENT_ID=${VITE_CLIENT_ID:-}
        - VITE_ORDER_PREFIX=${VITE_ORDER_PREFIX:-}
        - VITE_BRAND_NAME=${VITE_BRAND_NAME:-}
        - VITE_CLIENT_DOMAIN=${VITE_CLIENT_DOMAIN:-}
        - VITE_SUPPORT_EMAIL=${VITE_SUPPORT_EMAIL:-}
        - VITE_CLIENT_PHONE=${VITE_CLIENT_PHONE:-}
        - VITE_SUPPORT_PHONE=${VITE_SUPPORT_PHONE:-}
        - VITE_WHATSAPP_NUMBER=${VITE_WHATSAPP_NUMBER:-}
        - VITE_CLIENT_ADDRESS=${VITE_CLIENT_ADDRESS:-}
        - VITE_LOGO_URL=${VITE_LOGO_URL:-}
        - VITE_DASHBOARD_URL=${VITE_DASHBOARD_URL:-}
        - VITE_STOREFRONT_URL=${VITE_STOREFRONT_URL:-}
        - VITE_CLIENT_CONFIG_JSON=${VITE_CLIENT_CONFIG_JSON:-}
    container_name: ${DASHBOARD_CONTAINER_NAME:-ecommerce-dashboard-dev}
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8005}:8005"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mongodb-data-dev:
    driver: local