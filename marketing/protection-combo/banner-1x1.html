<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: radial-gradient(110% 90% at 0% 0%, #4a0d24 0%, #200b14 50%, #0b0a0e 100%);
    color: #fff; position: relative;
  }
  .logo { position: absolute; left: 60px; top: 56px; height: 62px; }
  .copy { position: absolute; left: 60px; top: 170px; width: 470px; }
  .kicker { font-family: 'Plus Jakarta Sans'; font-weight: 800; letter-spacing: .25em; font-size: 22px; color: #fbbf24; }
  h1 { font-size: 76px; line-height: 1.08; font-weight: 700; margin-top: 12px; }
  h1 span { color: #fb7185; display: block; }
  .sub { font-size: 28px; font-weight: 500; color: #fde2e8; margin-top: 14px; line-height: 1.35; }
  .save { display: inline-block; margin-top: 34px; background: linear-gradient(135deg, #fde047, #f59e0b); color: #3b0a17; border-radius: 28px; padding: 16px 30px; transform: rotate(-3deg); box-shadow: 0 14px 36px rgba(0,0,0,.5); }
  .save .amt { font-family: 'Plus Jakarta Sans'; font-size: 84px; font-weight: 800; line-height: 1; }
  .save .lbl { font-size: 40px; font-weight: 700; margin-left: 8px; }
  .prices { margin-top: 34px; display: flex; align-items: baseline; gap: 22px; }
  .now { font-family: 'Plus Jakarta Sans'; font-size: 80px; font-weight: 800; }
  .was { font-family: 'Plus Jakarta Sans'; font-size: 42px; font-weight: 700; color: rgba(255,255,255,.55); text-decoration: line-through; text-decoration-thickness: 4px; }
  .photo { position: absolute; right: 50px; top: 150px; width: 470px; height: 690px; object-fit: cover; object-fit: contain; background: #1c1b1f; border-radius: 36px; border: 6px solid rgba(251,113,133,.35); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: #fff; color: #0b0a0e; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
  .bar .info { font-size: 30px; font-weight: 600; }
  .bar .info b { color: #be123c; }
  .cta { background: linear-gradient(90deg, #e11d48, #9f1239); color: #fff; border-radius: 999px; padding: 20px 44px; font-size: 38px; font-weight: 700; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Surokkha">
  <div class="copy">
    <div class="kicker">PROTECTION COMBO</div>
    <h1>২০ পিস + <span>৫০ গ্রাম জেল</span></h1>
    <div class="sub">দুই বক্স ডটেড কনডম<br>+ পার্সোনাল জেল একসাথে</div>
    <div class="save"><span class="amt">৳৩০০</span><span class="lbl">ছাড়!</span></div>
    <div class="prices"><span class="now">৳৯৫০</span><span class="was">৳১২৫০</span></div>
  </div>
  <img class="photo" src="product.webp" alt="">
  <div class="bar">
    <div class="info">ক্যাশ অন ডেলিভারি • গোপনীয় প্যাকেজিং<br><b>surokkha.shop</b></div>
    <div class="cta">অর্ডার করুন</div>
  </div>
</body>
</html>
