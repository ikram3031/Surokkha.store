<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #4a0d24 0%, #200b14 45%, #0b0a0e 100%);
    color: #fff; position: relative;
  }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 56px 64px 0; }
  .logo { height: 70px; }
  .pill { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.25); border-radius: 999px; padding: 10px 26px; font-size: 28px; font-weight: 600; }
  .head { text-align: center; margin-top: 44px; }
  .kicker { font-family: 'Plus Jakarta Sans'; font-weight: 800; letter-spacing: .3em; font-size: 26px; color: #fbbf24; }
  h1 { font-size: 92px; line-height: 1.05; font-weight: 700; margin-top: 10px; }
  h1 span { color: #fb7185; }
  .sub { font-size: 34px; font-weight: 500; color: #fde2e8; margin-top: 10px; }
  .photo-wrap { position: relative; width: 700px; height: 700px; margin: 40px auto 0; }
  .photo { width: 100%; height: 100%; object-fit: cover; border-radius: 40px; box-shadow: 0 30px 80px rgba(0,0,0,.6); border: 6px solid rgba(251,113,133,.35); }
  .burst {
    position: absolute; right: -100px; top: 10px; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fde047, #f59e0b 70%);
    color: #3b0a17; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.5); transform: rotate(-10deg); border: 8px solid #fff;
  }
  .burst .amt { font-family: 'Plus Jakarta Sans'; font-size: 92px; font-weight: 800; line-height: 1; }
  .burst .lbl { font-size: 44px; font-weight: 700; line-height: 1.1; }
  .price { position: absolute; left: 50%; transform: translateX(-50%); top: 1100px; display: flex; align-items: center; gap: 28px;
    background: #fff; color: #0b0a0e; border-radius: 999px; padding: 14px 20px 14px 44px; box-shadow: 0 16px 40px rgba(0,0,0,.45); white-space: nowrap; }
  .price .now { font-family: 'Plus Jakarta Sans'; font-size: 76px; font-weight: 800; color: #be123c; }
  .price .was { font-family: 'Plus Jakarta Sans'; font-size: 44px; font-weight: 700; color: #6b7280; text-decoration: line-through; text-decoration-thickness: 4px; }
  .price .cta { background: linear-gradient(90deg, #e11d48, #9f1239); color: #fff; border-radius: 999px; padding: 18px 36px; font-size: 38px; font-weight: 700; }
  .foot { position: absolute; bottom: 44px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 600; color: #fde2e8; }
  .foot b { color: #fbbf24; }
</style>
</head>
<body>
  <div class="top">
    <img class="logo" src="logo.png" alt="Surokkha">
    <div class="pill">১০০% গোপনীয় ডেলিভারি</div>
  </div>
  <div class="head">
    <div class="kicker">MO DOTTED PLEASURE</div>
    <h1>২০ পিস <span>ডটেড কম্বো</span></h1>
    <div class="sub">মাল্টি-টেক্সচার্ড ডটেড, দুটি পূর্ণ বক্স একসাথে</div>
  </div>
  <div class="photo-wrap">
    <img class="photo" src="product.webp" alt="">
    <div class="burst"><div class="amt">৳২০০</div><div class="lbl">ছাড়!</div></div>
  </div>
  <div class="price">
    <span class="now">৳৭০০</span>
    <span class="was">৳৯০০</span>
    <span class="cta">অর্ডার করুন</span>
  </div>
  <div class="foot">ক্যাশ অন ডেলিভারি &nbsp;•&nbsp; সারা দেশে &nbsp;•&nbsp; <b>surokkha.shop</b></div>
</body>
</html>
