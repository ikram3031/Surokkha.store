services:
  mongodb:
    image: mongo:7.0
    container_name: ${MONGODB_CONTAINER_NAME:-surokkha-mongodb-live}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-surokkha-db}
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - surokkha-network

  backend-storefront:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${STOREFRONT_BACKEND_CONTAINER_NAME:-surokkha-backend-storefront}
    restart: always
    volumes:
      - ${ENV_FILE:-./.env}:/app/.env:ro
      - ${PUBLIC_UPLOADS_PATH:-/var/www/uploads}:/app/uploads
    environment:
      APP_ROLE: storefront
      PORT: ${STOREFRONT_BACKEND_PORT:-5094}
    command: ["node", "src/server.storefront.js"]
    ports:
      - "127.0.0.1:${STOREFRONT_BACKEND_PORT:-5094}:${STOREFRONT_BACKEND_PORT:-5094}"
    depends_on:
      - mongodb
    networks:
      - surokkha-network

  backend-dashboard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${DASHBOARD_BACKEND_CONTAINER_NAME:-surokkha-backend-dashboard}
    restart: always
    volumes:
      - ${ENV_FILE:-./.env}:/app/.env:ro
      - ${PUBLIC_UPLOADS_PATH:-/var/www/uploads}:/app/uploads
    environment:
      APP_ROLE: dashboard
      PORT: ${DASHBOARD_BACKEND_PORT:-5096}
    command: ["node", "src/server.dashboard.js"]
    ports:
      - "127.0.0.1:${DASHBOARD_BACKEND_PORT:-5096}:${DASHBOARD_BACKEND_PORT:-5096}"
    depends_on:
      - mongodb
    networks:
      - surokkha-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://service.surokkha.store}
        - VITE_CLIENT=surokkha
    container_name: ${DASHBOARD_CONTAINER_NAME:-surokkha-dashboard-live}
    restart: always
    volumes:
      - ${ENV_FILE:-./.env}:/app/.env:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8005}:8005"
    networks:
      - surokkha-network

  frontend:
    build:
      context: ./SurokkhaShop
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-surokkha-frontend-live}
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - surokkha-network

networks:
  surokkha-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local