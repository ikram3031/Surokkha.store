# 1a. Surokkha Store (https://surokkha.store) — dockerized frontend-store container
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name surokkha.store www.surokkha.store;
    client_max_body_size 50M;

    ssl_certificate /etc/ssl/surokkha/surokkha.crt;
    ssl_certificate_key /etc/ssl/surokkha/surokkha.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    location ^~ /uploads/ {
        alias /opt/clients/surokkha-mtEcom/backend/uploads/;
        expires 30d;
        add_header Cache-Control public;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

