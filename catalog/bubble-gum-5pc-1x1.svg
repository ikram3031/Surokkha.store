<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#fff1f8"/>
      <stop offset="1" stop-color="#ffc9e3"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fa8"/>
      <stop offset="1" stop-color="#c2268a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a01c72"/>
      <stop offset="1" stop-color="#7e1257"/>
    </linearGradient>
    <radialGradient id="bub" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#ffd3ea"/>
      <stop offset="1" stop-color="#ff7fbf"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#8a1760" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g fill="#fff" opacity=".55">
    <circle cx="120" cy="150" r="46"/><circle cx="960" cy="210" r="30"/>
    <circle cx="90" cy="860" r="28"/><circle cx="985" cy="900" r="52"/>
    <circle cx="880" cy="95" r="16"/><circle cx="205" cy="990" r="18"/>
  </g>

  <ellipse cx="540" cy="905" rx="300" ry="34" fill="#8a1760" opacity=".18"/>

  <!-- pack: side + front -->
  <g filter="url(#sh)">
    <polygon points="770,260 850,222 850,820 770,858" fill="url(#side)"/>
    <rect x="270" y="260" width="500" height="598" rx="26" fill="url(#box)"/>
  </g>
  <rect x="270" y="260" width="500" height="150" rx="26" fill="#fff" opacity=".12"/>

  <!-- brand-neutral label -->
  <text x="520" y="350" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="10" fill="#fff" opacity=".9">SUROKKHA</text>

  <!-- big bubble -->
  <g>
    <circle cx="520" cy="560" r="150" fill="url(#bub)"/>
    <ellipse cx="470" cy="500" rx="42" ry="26" fill="#fff" opacity=".8" transform="rotate(-30 470 500)"/>
    <circle cx="610" cy="640" r="12" fill="#fff" opacity=".6"/>
  </g>
  <circle cx="680" cy="445" r="34" fill="url(#bub)"/>
  <circle cx="380" cy="690" r="26" fill="url(#bub)"/>

  <text x="520" y="745" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="74" font-weight="800" fill="#fff">Bubble Gum</text>

  <!-- 5 pcs badge -->
  <g transform="translate(742 300)">
    <circle r="82" fill="#ffe14d" stroke="#fff" stroke-width="8"/>
    <text y="-4" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="76" font-weight="800" fill="#7e1257">5</text>
    <text y="38" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="2" fill="#7e1257">PIECES</text>
  </g>

  <text x="540" y="985" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="600" fill="#7e1257">Pack of 5 · Sweet bubble gum flavour</text>
</svg>
