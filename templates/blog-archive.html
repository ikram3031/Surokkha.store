<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ব্লগ | সুরক্ষা</title>
<meta name="description" content="নিরাপদ ও সুস্থ সম্পর্ক নিয়ে সহজ ভাষায় সঠিক তথ্য। স্বাস্থ্য, নিরাপত্তা, টিপস ও পণ্য গাইড, সুরক্ষা টিমের পক্ষ থেকে।">
<script>try{if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700;800&display=swap" rel="stylesheet">

<!-- Tailwind (Play CDN)। Production-এ build করা CSS ব্যবহার করুন। কনফিগ blog-shared.js-এ -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="blog-shared.js"></script>
<link rel="stylesheet" href="blog-shared.css">
</head>

<body class="bg-background text-foreground">
<div id="siteHeader"></div>

<main class="mx-auto max-w-7xl px-4 pt-8 sm:px-6 sm:pt-12">

  <!-- হিরো -->
  <section class="relative overflow-hidden rounded-3xl bg-secondary px-5 py-8 sm:px-10 sm:py-12">
    <span class="floaty pointer-events-none absolute -right-12 -top-12 h-56 w-56 rounded-full bg-accent"></span>
    <span class="pointer-events-none absolute -bottom-20 right-1/4 h-48 w-48 rounded-full bg-blush/25"></span>
    <div class="relative max-w-2xl">
      <p class="text-sm font-semibold uppercase tracking-wider text-primary">সুরক্ষা ব্লগ</p>
      <h1 class="font-display mt-2 text-3xl font-extrabold leading-snug sm:text-4xl md:text-5xl md:leading-tight">জানুন, বুঝুন, নিরাপদ থাকুন</h1>
      <p class="mt-3 text-lg leading-relaxed text-muted-foreground">যৌন স্বাস্থ্য ও নিরাপদ সম্পর্ক নিয়ে সহজ ভাষায় সঠিক তথ্য। কোনো লজ্জা নয়, কোনো ভুল ধারণা নয়।</p>
      <div class="mt-5 flex flex-wrap gap-x-5 gap-y-2 text-sm font-medium text-muted-foreground" id="heroStats"></div>
    </div>
  </section>

  <!-- মোবাইলে দ্রুত ক্যাটাগরি -->
  <div class="no-scrollbar -mx-4 mt-5 flex gap-2 overflow-x-auto px-4 pb-1 sm:-mx-6 sm:px-6 lg:hidden" id="quickCats" aria-label="দ্রুত ক্যাটাগরি"></div>

  <div class="mt-8 grid gap-8 lg:grid-cols-[290px_minmax(0,1fr)] lg:gap-10">
    <div id="sidebarSlot"></div>

    <section id="results" class="min-w-0 scroll-mt-24" aria-label="ব্লগ লেখাসমূহ">
      <!-- টুলবার -->
      <div class="flex flex-wrap items-center gap-3">
        <button type="button" data-open-sidebar aria-controls="sidebar" aria-expanded="false" class="inline-flex h-11 items-center gap-2 rounded-full bg-primary px-5 font-semibold text-primary-foreground shadow-md shadow-primary/25 lg:hidden" id="openFilter"></button>
        <p id="count" class="text-sm text-muted-foreground" aria-live="polite"></p>
        <div class="ml-auto flex items-center gap-2">
          <label for="sort" class="hidden text-sm text-muted-foreground sm:block">সাজান</label>
          <select id="sort" class="h-11 rounded-full border border-border bg-card px-4 text-sm font-medium outline-none focus:border-ring focus:ring-4 focus:ring-ring/30">
            <option value="new">নতুন আগে</option>
            <option value="pop">জনপ্রিয় আগে</option>
            <option value="short">ছোট লেখা আগে</option>
          </select>
        </div>
      </div>

      <!-- সক্রিয় ফিল্টার -->
      <div id="active" class="mt-3 flex min-h-[2rem] flex-wrap items-center gap-2"></div>

      <!-- ফিচারড -->
      <div id="featured" class="mt-5"></div>

      <!-- গ্রিড -->
      <div id="grid" class="mt-6 grid gap-5 sm:grid-cols-2 2xl:grid-cols-3"></div>

      <div id="empty" class="mt-10 hidden rounded-3xl border border-dashed border-border bg-card p-8 text-center">
        <p class="font-display text-xl font-bold">কোনো লেখা পাওয়া যায়নি</p>
        <p class="mt-2 text-muted-foreground">অন্য কোনো শব্দ, ক্যাটাগরি বা ট্যাগ দিয়ে চেষ্টা করুন।</p>
        <button type="button" id="resetAll" class="mt-5 inline-flex h-11 items-center rounded-full bg-primary px-6 font-semibold text-primary-foreground">সব ফিল্টার মুছুন</button>
      </div>

      <div class="mt-10 text-center">
        <button type="button" id="more" class="hidden h-12 items-center rounded-full border border-border bg-card px-8 font-semibold transition hover:border-primary hover:text-primary active:scale-95"></button>
      </div>
    </section>
  </div>

  <!-- নিচের বড় সিটিএ -->
  <div class="mt-16" id="endCta"></div>
</main>

<div id="siteFooter"></div>

<script>
  const { POSTS, CATS, TAGS, bn, esc, catOf, tagOf, icon, card, cta, fmtDate, postUrl, archiveUrl } = SB;
  const $ = (id) => document.getElementById(id);
  const PER = 6;

  SB.mountChrome();
  const drawer = SB.initDrawer();
  SB.initNewsletter();

  /* ── URL থেকে অবস্থা পড়া ── */
  const params = new URLSearchParams(location.search);
  const state = {
    cat: CATS.some((c) => c.id === params.get('cat')) ? params.get('cat') : 'all',
    tags: new Set((params.get('tag') || '').split(',').filter((t) => TAGS.some((x) => x.id === t))),
    q: (params.get('q') || '').trim(),
    sort: ['new', 'pop', 'short'].includes(params.get('sort')) ? params.get('sort') : 'new',
    page: 1,
  };

  /* ── স্ট্যাটিক অংশ ── */
  $('heroStats').innerHTML = [`${bn(POSTS.length)}টি লেখা`, `${bn(CATS.length)}টি ক্যাটাগরি`, 'চিকিৎসা-তথ্য ভিত্তিক'].map((t) => `<span class="inline-flex items-center gap-1.5">${icon('check', 'h-4 w-4 text-primary')}${t}</span>`).join('');
  $('openFilter').innerHTML = `${icon('menu', 'h-5 w-5')} ক্যাটাগরি ও ট্যাগ <span id="fBadge" class="hidden h-6 min-w-6 items-center justify-center rounded-full bg-card px-1.5 text-xs font-bold text-primary"></span>`;
  $('endCta').innerHTML = cta('end');

  const norm = (s) => s.toLowerCase().replace(/\s+/g, ' ').trim();
  const haystack = (p) => norm([p.title, p.excerpt, catOf(p.cat).name, ...p.tags.map((t) => tagOf(t).name)].join(' '));
  const sorters = { new: (a, b) => b.date.localeCompare(a.date), pop: (a, b) => b.pop - a.pop, short: (a, b) => a.read - b.read };

  const filtered = () => {
    const q = norm(state.q);
    return POSTS.filter((p) =>
      (state.cat === 'all' || p.cat === state.cat) &&
      (!state.tags.size || p.tags.some((t) => state.tags.has(t))) &&
      (!q || haystack(p).includes(q))
    ).sort(sorters[state.sort]);
  };

  const featuredCard = (p) => {
    const c = catOf(p.cat);
    return `<a href="${postUrl(p)}" class="post-card rise group grid overflow-hidden rounded-3xl border border-border bg-card md:grid-cols-2">
      ${SB.cover(p, 'aspect-[16/10] md:aspect-auto md:h-full md:min-h-[300px]')}
      <div class="flex flex-col justify-center p-6 sm:p-8">
        <span class="w-fit rounded-full bg-primary px-3 py-1 text-xs font-semibold text-primary-foreground">সম্পাদকের পছন্দ</span>
        <h2 class="font-display mt-4 text-2xl font-extrabold leading-snug transition group-hover:text-primary sm:text-3xl sm:leading-snug">${p.title}</h2>
        <p class="mt-3 line-clamp-3 leading-relaxed text-muted-foreground">${p.excerpt}</p>
        <div class="mt-4 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-muted-foreground">
          <span class="font-semibold text-foreground">${c.name}</span><span>·</span><span>${fmtDate(p.date)}</span><span>·</span><span>${bn(p.read)} মিনিট পড়া</span>
        </div>
        <span class="mt-5 inline-flex w-fit items-center gap-2 rounded-full bg-primary px-5 py-2.5 font-semibold text-primary-foreground transition group-hover:gap-3">লেখাটি পড়ুন ${icon('arrow', 'h-4 w-4')}</span>
      </div></a>`;
  };

  const chip = (label, kind, id) => `<span class="chip">${esc(label)}<button type="button" data-clear="${kind}" data-id="${id || ''}" aria-label="${esc(label)} সরান">${icon('x', 'h-3.5 w-3.5')}</button></span>`;

  function render({ keepPage = false } = {}) {
    if (!keepPage) state.page = 1;
    const list = filtered();
    const filtering = state.cat !== 'all' || state.tags.size || state.q;
    const feat = !filtering && state.sort === 'new' ? POSTS.find((p) => p.featured) : null;
    const rest = feat ? list.filter((p) => p !== feat) : list;
    const shown = rest.slice(0, state.page * PER);

    $('featured').innerHTML = feat ? featuredCard(feat) : '';
    $('grid').innerHTML = shown.map((p, i) => card(p, i)).join('');
    // ৪র্থ কার্ডের পর ইনলাইন সিটিএ
    if (shown.length >= 4) {
      const cell = document.createElement('div');
      cell.className = 'sm:col-span-2 2xl:col-span-3 rise';
      cell.innerHTML = cta('inline');
      $('grid').children[3].after(cell);
    }

    $('empty').classList.toggle('hidden', list.length > 0);
    $('count').textContent = list.length ? `${bn(list.length)}টি লেখা` : '';

    const left = rest.length - shown.length;
    $('more').classList.toggle('hidden', left <= 0);
    $('more').classList.toggle('inline-flex', left > 0);
    $('more').textContent = `আরও লেখা দেখান (${bn(left)}টি বাকি)`;

    // চিপ
    const chips = [];
    if (state.cat !== 'all') chips.push(chip(catOf(state.cat).name, 'cat'));
    state.tags.forEach((t) => chips.push(chip('#' + tagOf(t).name, 'tag', t)));
    if (state.q) chips.push(chip(`“${state.q}”`, 'q'));
    if (chips.length > 1) chips.push('<button type="button" data-clear="all" class="text-sm font-semibold text-primary underline underline-offset-4">সব মুছুন</button>');
    $('active').innerHTML = chips.join('');

    const n = (state.cat !== 'all') + state.tags.size + (state.q ? 1 : 0);
    const b = $('fBadge'); b.textContent = bn(n); b.classList.toggle('hidden', !n); b.classList.toggle('inline-flex', !!n);

    // কুইক ক্যাটাগরি (মোবাইল)
    $('quickCats').innerHTML = [['all', 'সব']].concat(CATS.map((c) => [c.id, c.name])).map(([id, name]) =>
      `<a href="${archiveUrl({ cat: id })}" data-cat="${id}" class="tag-pill shrink-0 !px-4 !py-2 !text-[0.95rem]" aria-pressed="${state.cat === id}">${name}</a>`).join('');

    SB.fillSidebar(state);
    $('sort').value = state.sort;
    if (document.activeElement !== $('q')) $('q').value = state.q;

    // URL সিঙ্ক (রিলোড/শেয়ার করলেও ফিল্টার থাকবে)
    const u = new URLSearchParams();
    if (state.cat !== 'all') u.set('cat', state.cat);
    if (state.tags.size) u.set('tag', [...state.tags].join(','));
    if (state.q) u.set('q', state.q);
    if (state.sort !== 'new') u.set('sort', state.sort);
    history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
    document.title = (state.cat !== 'all' ? catOf(state.cat).name + ' | ' : '') + 'ব্লগ | সুরক্ষা';
  }

  const toResults = () => { if (scrollY > $('results').offsetTop - 90) $('results').scrollIntoView({ behavior: 'smooth', block: 'start' }); };

  /* ── ক্লিক: ক্যাটাগরি / ট্যাগ / চিপ মোছা ── */
  document.addEventListener('click', (e) => {
    const catA = e.target.closest('a[data-cat]'), tagA = e.target.closest('a[data-tag]'), clr = e.target.closest('[data-clear]');
    if (catA) {
      e.preventDefault(); state.cat = catA.dataset.cat; drawer.close(); render(); toResults();
    } else if (tagA) {
      e.preventDefault(); const t = tagA.dataset.tag; state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); render(); toResults();
    } else if (clr) {
      const k = clr.dataset.clear;
      if (k === 'cat') state.cat = 'all'; else if (k === 'tag') state.tags.delete(clr.dataset.id); else if (k === 'q') state.q = '';
      else { state.cat = 'all'; state.tags.clear(); state.q = ''; }
      render();
    }
  });
  $('resetAll').addEventListener('click', () => { state.cat = 'all'; state.tags.clear(); state.q = ''; render(); });
  $('more').addEventListener('click', () => { state.page++; render({ keepPage: true }); });
  $('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });

  /* ── সার্চ: টাইপ করার সাথে সাথে ── */
  let t;
  $('q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 180); });
  $('sbSearch').addEventListener('submit', (e) => { e.preventDefault(); state.q = $('q').value.trim(); drawer.close(); render(); toResults(); });

  render();
</script>
</body>
</html>
