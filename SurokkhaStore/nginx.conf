server {
    listen 80;
    listen 3001;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # One canonical domain for search engines: surokkha.store and www.* move to surokkhastore.shop
    # (the host nginx forwards the visitor's Host header)
    if ($http_host ~* ^(www\.)?surokkha\.store$|^www\.surokkhastore\.shop$) {
        return 301 https://surokkhastore.shop$request_uri;
    }

    # Products and categories sitemap, built live by the storeWeb API.
    # A variable upstream with a resolver keeps nginx starting even if DNS is down.
    location = /sitemap-catalog.xml {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $store_api https://web.surokkha.store;
        proxy_pass $store_api/store/v1/seo/sitemap-catalog.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host web.surokkha.store;
    }

    location ~ ^/(robots\.txt|sitemap(-pages)?\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
        if_modified_since off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
